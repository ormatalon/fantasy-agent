name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group desktop
      - run: uv run pytest -q
      - run: uv run pyinstaller desktop/fantasy-agent.spec --noconfirm
      - name: Installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          iscc "/DAppVersion=$v" desktop\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FantasyAgent-Setup
          path: dist/installer/*.exe
