# On every push to main: publish the Docker image to ghcr.io.
# On a version tag (v1.0.0): also build the Windows installer and the Mac app,
# and create one GitHub release with all downloads.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fantasy-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Build the page
        working-directory: web
        run: npm ci && npm run build
      - name: Build the app
        run: uv run --group desktop pyinstaller desktop/fantasy-agent.spec --noconfirm
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sL -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          Start-Process innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$PWD\inno" -Wait
          & "$PWD\inno\ISCC.exe" "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" desktop\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Mac disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Fantasy Agent" -srcfolder dist/FantasyAgent.app -ov -format UDZO dist/FantasyAgent-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/FantasyAgent-Setup.exe
            dist/FantasyAgent-Mac.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Docker zip
        run: |
          mkdir -p fantasy-agent/scripts
          cp docker-compose.yml fantasy-agent/
          cp scripts/start.sh scripts/stop.sh scripts/start.bat scripts/stop.bat fantasy-agent/scripts/
          chmod +x fantasy-agent/scripts/*.sh
          zip -r downloads/fantasy-agent-docker.zip fantasy-agent
      - run: gh release create "$GITHUB_REF_NAME" downloads/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
