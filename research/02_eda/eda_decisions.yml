cleaning:
  parsing_fixes: []
  null_tokens:
  - NA
  - N/A
  - 'null'
  - None
  - ''
  - ' '
  - '?'
  - '-'
  sentinels_to_nan: []
  spelling_mappings: []
  duplicates:
    full_row:
      count: 0
      action: drop
      status: applied
    conflicting_key:
      count: 0
      action: keep_all
      status: applied
      reason: no duplicated keys
  invalid_values:
  - column: snap_share_l3
    rule: snap_share_l3 < 0 or snap_share_l3 > 1
    count: 4
    action: set_nan
    status: recommended
    reason: outside the physically possible range
  outlier_removals: []
recommendations:
  drop_columns:
  - column: kickoff
    reason: timestamp, not a feature
    status: recommended
  - column: name
    reason: identifier
    status: recommended
  - column: gsis_id
    reason: identifier (NFL id)
    status: recommended
  - column: team
    reason: identity effect eps2 0.004; would memorise team-seasons
    status: recommended
  - column: opponent
    reason: identity effect eps2 0.000; strength captured by the opp_* defense features
    status: recommended
  - column: rec_tgt_l3
    reason: r=0.97 with tgt_share_l3
    status: recommended
  - column: rec_tgt_l8
    reason: r=0.98 with tgt_share_l8
    status: recommended
  - column: qb_cpoe_rel_l8
    reason: PSI 0.21 train vs test even league-relative; adds nothing beyond qb_epa_db_rel_l8
    status: recommended
  leakage:
  - column: kickoff
    evidence: timestamp
    verdict: drop
  - column: fp_ecr
    evidence: last FantasyPros scrape before the first kickoff; one value per player-season
    verdict: keep
  - column: sleeper_adp
    evidence: ADP stored with week-1 projections; frozen for the season
    verdict: keep
  - column: xfp_l8
    evidence: expected points of past regular-season games; 1200/1200 recomputed values
      matched
    verdict: keep
  - column: pts_l3
    evidence: 'history features audited: 400/400 recomputed values matched'
    verdict: keep
  - column: opp_pass_epa_allowed_rel_l8
    evidence: team-stats history audited 300/300; league mean uses only that week's
      pre-game values
    verdict: keep
  - column: is_expected_qb
    evidence: last game's starter if available; matches the real starter 89.8%
    verdict: keep
  missing_indicators:
  - column: pts_l8
    mechanism: MAR
    reason: whole history block missing for debuts; act 1.6 vs 6.0
  - column: pts_prev_season
    mechanism: MAR
    reason: rookies / absent last season; act 3.8 vs 6.3
  - column: xfp_l8
    mechanism: MAR
    reason: no ff_opportunity history; act 1.0 vs 6.1
  - column: fp_ecr
    mechanism: MNAR
    reason: unranked preseason; act 1.4 vs 6.8
  - column: sleeper_adp
    mechanism: MNAR
    reason: undrafted preseason; act 2.3 vs 7.3
  - column: report_status
    mechanism: MNAR
    reason: missing = not on the injury report; own level
  - column: practice_status
    mechanism: MNAR
    reason: missing = not on the practice report; own level
  capping: []
  transforms: []
  rare_level_grouping: []
  manual_treatment:
  - column: player_id
    kind: high_card_categorical
    cardinality: 1012
    examples:
    - '1029'
    - '1034'
    - '1049'
  redundant_pairs:
  - columns:
    - rec_tgt_l8
    - tgt_share_l8
    measure: pearson
    value: 0.983
    suggestion: drop rec_tgt_l8 (and rec_tgt_l3)
  - columns:
    - sleeper_pos_adp
    - fp_pos_rank
    measure: spearman
    value: 0.955
    suggestion: keep both; they disagree on the undrafted tail
  datetime_parts: []
  target:
    transform: null
    class_weights: null
    reason: '37% zeros with negatives; lineups need expected points: squared-error
      on the raw target, Tweedie as an experiment'
validation:
  split: already_split
  group_column: player_id
  stratify_on: []
  holdout: '2026 weeks 1-7 (test file); inside train an expanding season split: fit
    2022-2023 -> validate 2024, fit 2022-2024 -> validate 2025'
  representativeness_issues:
  - feature: total_line
    psi: 0.15
    note: higher 2026 totals; moderate
  - feature: qb_cpoe_rel_l8
    psi: 0.21
    note: dropped
  - feature: team_plays_rel_l8
    psi: 0.12
    note: league-relative (raw was 0.23)
  - feature: opp_pass_epa_allowed_rel_l8
    psi: 0.11
    note: league-relative
  metric:
    primary: rmse
    secondary:
    - mae
    - within_week_spearman
    - bias
    - rmse_played_only
    reason: lineup value is expected points (mean); MAE rewards median shrinkage;
      played-only isolates performance from availability
open_questions:
- Sleeper's final snapshot knows game-day inactives (it projects 0 for 96% of players
  who end up not playing). Should the headline comparison include those rows (fair
  to the use case) or only players who played (fair to the model)? Both are reported.
