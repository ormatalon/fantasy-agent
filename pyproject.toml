[project]
name = "fantasy-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "nfl_data_py>=0.3",
    "pulp>=2.8",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.12.5",
    "fastapi>=0.149.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
desktop = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pywebview>=6.2.1",
]
dev = [
    "pytest>=8.0",
]
